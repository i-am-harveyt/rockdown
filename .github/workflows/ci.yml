name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Initialize MSVC and Windows SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Locate Windows shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Join-Path $env:WindowsSdkVerBinPath 'x64\fxc.exe'
          if (-not (Test-Path $fxc)) { throw "Windows SDK shader compiler missing: $fxc" }
          "GPUI_FXC_PATH=$fxc" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - name: Check CLI without a window
        shell: bash
        run: |
          cargo run --release --locked -- --help
          cargo run --release --locked -- --check-config --config examples/config.toml
      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rockdown-windows-x64
          path: target/release/rockdown.exe
          if-no-files-found: error

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rockdown-macos-aarch64.zip
            use_app_bundle: true

          # macOS Intel (x86_64)
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: rockdown-macos-x86_64.zip
            use_app_bundle: true

          # Windows 64-bit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rockdown-windows-x64.zip
            use_app_bundle: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # Package macOS .app bundle
      - name: Package macOS App Bundle
        if: matrix.use_app_bundle
        run: |
          APP_NAME="Rockdown.app"
          APP_DIR="target/bundle/${APP_NAME}"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"

          cp "target/${{ matrix.target }}/release/rockdown" "${APP_DIR}/Contents/MacOS/rockdown"
          chmod +x "${APP_DIR}/Contents/MacOS/rockdown"
          cp "extra/macos/Info.plist" "${APP_DIR}/Contents/Info.plist"

          if [ -f "extra/macos/Rockdown.icns" ]; then
            cp "extra/macos/Rockdown.icns" "${APP_DIR}/Contents/Resources/Rockdown.icns"
          fi

          mkdir -p dist
          (cd target/bundle && zip -q -r "../../dist/${{ matrix.artifact_name }}" "${APP_NAME}")

      # Package Windows archive
      - name: Package Windows Binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $files = @(
            "target/${{ matrix.target }}/release/rockdown.exe",
            "README.md"
          )
          Compress-Archive -Path $files -DestinationPath "dist/${{ matrix.artifact_name }}"

      # Upload built artifact for release step
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false

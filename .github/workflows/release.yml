name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and release (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 64-bit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rockdown-windows-x64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" == v* ]] || { echo 'Release tag must start with v'; exit 1; }
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Initialize MSVC and Windows SDK
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate Windows shader compiler
        shell: pwsh
        run: |
          $fxc = Join-Path $env:WindowsSdkVerBinPath 'x64\fxc.exe'
          if (-not (Test-Path $fxc)) { throw "Windows SDK shader compiler missing: $fxc" }
          "GPUI_FXC_PATH=$fxc" >> $env:GITHUB_ENV

      - name: Test Windows build
        run: cargo test --locked --all-targets --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      # Package Windows archive
      - name: Package Windows Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $files = @(
            "target/${{ matrix.target }}/release/rockdown.exe",
            "README.md"
          )
          Compress-Archive -Path $files -DestinationPath "dist/${{ matrix.artifact_name }}"

      # Upload built artifact for release step
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: '*-*-*'
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false

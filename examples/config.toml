# Copy to ~/.config/rockdown/config.toml (Unix),
# or %APPDATA%\rockdown\config.toml (Windows), or pass --config PATH.
# font_family = "Menlo" # Default: Consolas on Windows, Menlo elsewhere.
font_size = 15
line_height = 30
# Markdown column maximum in logical pixels (320–1600); shrinks with the window.
writing_width = 820
markdown_line_numbers = false
# Hide either bar at startup; F1 → Appearance or the shortcuts below toggle it.
tab_bar_visible = true
status_bar_visible = true
# Pasted/dropped images are copied beside the Markdown file into this child path.
image_assets_dir = "assets"
explorer_width = 290
terminal_height = 240
# Toggle the right dock with Ctrl-E; drag its left edge to resize.
# shell = "/bin/zsh" # Defaults to $SHELL, then /bin/sh.
# Windows defaults to %COMSPEC%, then cmd.exe. To use PowerShell instead:
# shell = 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
# shell = 'C:\Program Files\PowerShell\7\pwsh.exe'

[theme]
# Built-ins: rockdown, paper. Other IDs load colorscheme/<id>.toml beside this file.
# For Nord, copy examples/nord.toml into colorscheme/nord.toml and select "nord".
preset = "rockdown"
# Optional overrides take precedence over the preset:
# background = "#171b22"
# panel = "#1e242e"
# foreground = "#dce3ec"
# muted = "#8995a7"
# accent = "#9cc7b5"

# Optional Markdown overrides; leave colors commented to follow the preset.
# normal inherits theme.foreground; headings/code/link inherit theme.accent.
# quote/strikethrough/divider inherit theme.muted; emphasis inherits its text color.
# The picker replaces color overrides for the session, but preserves typography.
[markdown.colors]
# bold = "#f2cf8f"
# italic = "#bac7ed"
# bold_italic = "#edb8d6"
# code = "#a8d4bc"
# link = "#8fc8ed"
# strikethrough = "#8995a7"
# quote = "#a8b4c7"

# Every level accepts font_size, color, and underline independently.
# Unset sizes use built-in heading scaling; larger sizes expand rows.
[markdown.h1]
font_size = 32
# color = "#c2dded"
underline = true

[markdown.h2]
font_size = 27
underline = true

[markdown.h3]
font_size = 23

[markdown.h4]
font_size = 20

[markdown.h5]
font_size = 18

[markdown.h6]
font_size = 16

# Horizontal rules and heading underlines share these settings.
# Omitted color inherits theme.muted; thickness defaults to 1.
[markdown.divider]
# color = "#566575"
thickness = 1.5

# Specifying keys replaces the default shortcut map.
# Supported actions: new, open, save, save-as, paste (clipboard), explorer (toggle),
# terminal, editor, help, themes, outline, buffer-delete, previous-buffer, next-buffer.
# tab-bar, status-bar.
[keys]
cmd-n = "new"
ctrl-n = "new"
cmd-o = "open"
ctrl-o = "open"
cmd-shift-s = "save-as"
ctrl-shift-s = "save-as"
cmd-s = "save"
ctrl-s = "save"
cmd-v = "paste"
ctrl-shift-v = "paste"
cmd-e = "explorer"
ctrl-e = "explorer"
"ctrl-`" = "terminal"
cmd-1 = "editor"
ctrl-1 = "editor"
ctrl-pageup = "previous-buffer"
ctrl-pagedown = "next-buffer"
cmd-w = "buffer-delete"
ctrl-shift-w = "buffer-delete"
f1 = "help"
cmd-shift-t = "themes"
ctrl-shift-t = "themes"
cmd-shift-o = "outline"
ctrl-shift-o = "outline"
cmd-alt-t = "tab-bar"
ctrl-alt-t = "tab-bar"
cmd-alt-s = "status-bar"
ctrl-alt-s = "status-bar"

# Copy to ~/.config/rockdown/config.toml (Unix),
# or %APPDATA%\rockdown\config.toml (Windows), or pass --config PATH.
# font_family = "Menlo" # Default: Consolas on Windows, Menlo elsewhere.
font_size = 15
line_height = 30
explorer_width = 290
terminal_height = 240
# Toggle the right dock with Ctrl-E; drag its left edge to resize.
# shell = "/bin/zsh" # Defaults to $SHELL, then /bin/sh.
# Windows defaults to %COMSPEC%, then cmd.exe. To use PowerShell instead:
# shell = 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
# shell = 'C:\Program Files\PowerShell\7\pwsh.exe'

[theme]
background = "#171b22"
panel = "#1e242e"
foreground = "#dce3ec"
muted = "#8995a7"
accent = "#9cc7b5"

# Optional Markdown overrides; omitted fields retain their defaults.
# normal inherits theme.foreground; code/link inherit theme.accent.
# Other omitted colors inherit normal (or the applicable heading/quote color).
[markdown.colors]
bold = "#f2cf8f"
italic = "#bac7ed"
bold_italic = "#edb8d6"
code = "#a8d4bc"
link = "#8fc8ed"
strikethrough = "#8995a7"
quote = "#a8b4c7"

# Every level accepts font_size, color, and underline independently.
# Unset sizes use built-in heading scaling; larger sizes expand rows.
[markdown.h1]
font_size = 32
color = "#c2dded"
underline = true

[markdown.h2]
font_size = 27
underline = true

[markdown.h3]
font_size = 23

[markdown.h4]
font_size = 20

[markdown.h5]
font_size = 18

[markdown.h6]
font_size = 16

# Horizontal rules and heading underlines share these settings.
# Omitted color inherits normal; thickness defaults to 1.
[markdown.divider]
color = "#566575"
thickness = 1.5

# Specifying keys replaces the default shortcut map.
# Supported actions: save, paste (clipboard), explorer (toggle), terminal,
# editor, help, buffer-delete, previous-buffer, next-buffer.
[keys]
cmd-s = "save"
ctrl-s = "save"
cmd-v = "paste"
ctrl-shift-v = "paste"
cmd-e = "explorer"
ctrl-e = "explorer"
"ctrl-`" = "terminal"
cmd-1 = "editor"
ctrl-1 = "editor"
ctrl-pageup = "previous-buffer"
ctrl-pagedown = "next-buffer"
cmd-w = "buffer-delete"
ctrl-shift-w = "buffer-delete"
f1 = "help"

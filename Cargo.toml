[package]
name = "rockdown"
version = "0.1.0"
edition = "2024"
description = "A native, Vim-first Markdown workspace built with GPUI"
license = "MIT"

[dependencies]
anyhow = "1"
# Compile Metal shaders through the driver; no separate Xcode Metal toolchain needed.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
# Local preview images: decode once, paint as quads. Matches gpui's pinned version.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
portable-pty = "0.9"
# The editor consumes parser events, not HTML output or the command-line parser.
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
# Keep bundled grammars/themes and the Rust regex engine; no external loaders/exporters.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
unicode-segmentation = "1"
vt100 = "0.16"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders", "test-support"] }
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
